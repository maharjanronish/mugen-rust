name: android-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit + integration tests
        run: cargo test --workspace

  debug-apk:
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi \
            x86_64-linux-android i686-linux-android
          cargo install --locked cargo-ndk

      - name: Install SDK components + NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.3.11579264" > /dev/null
          # Runner-level $ANDROID_HOME is not in the Actions `env` context,
          # so it must be expanded in the shell and exported via GITHUB_ENV.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Build native library (all ABIs)
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o android/app/src/main/jniLibs build --release -p krg-android

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: cd android && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kurogane-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
